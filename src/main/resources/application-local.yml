# ===============================
# 로깅 설정
# ===============================
logging:
  config: classpath:logs/logback-local.xml

# ===============================
# 데이터베이스 설정 (H2)
# ===============================
spring:
  flyway:
    enabled: true # Flyway 사용 여부 (true로 설정하면 앱 실행 시 마이그레이션 자동 수행)
    baseline-on-migrate: true # DB가 이미 존재하더라도 Flyway를 적용할 수 있도록 기준점을 설정
    locations: classpath:db/migration/h2 # 마이그레이션 SQL 파일의 위치 지정 (classpath 기준 경로)
    sql-migration-prefix: V # 마이그레이션 파일의 버전 prefix (예: V1__init.sql)
    sql-migration-separator: __ # prefix와 설명 사이의 구분자 (V1__init.sql에서 '__' 부분)
    sql-migration-suffixes: .sql # 마이그레이션 파일의 확장자 (기본은 .sql, 여러 개도 지정 가능)

  datasource:
    url: jdbc:h2:tcp://localhost/~/lunch
    username: sa
    password:
    driver-class-name: org.h2.Driver
    console:
      enabled: true
      path: /h2-console

  # ===============================
  # JPA 및 Hibernate 설정
  # ===============================
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        show_sql: false
        use_sql_comments: false
        generate_statistics: false
        default_batch_fetch_size: 100
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none
    show-sql: true # Hibernate SQL 출력
    defer-datasource-initialization: false
    open-in-view: true

  # ===============================
  # Redis 설정
  # ===============================
  redis:
    host: ENC(kcGli1hQDUI+PuWR5y3uGytjiSIacdjW4Ye8aZAFmZA+NU3j6phdPiNiI4LZOAgNkCz9wc197guDPE92gQe0lZQAM22HAXF3)
    port: 10352
    password: ENC(po92S3UxLb/hK+62OAX7vTdc0jvCl50G/GsoYAmumc0/YSU+3XB/3yIv99stu2S6)
