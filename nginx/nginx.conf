worker_processes auto;  # CPU 코어 개수에 맞춰 자동으로 Worker 프로세스 개수 설정

events {
    worker_connections 1024;  # 한 워커 프로세스가 처리할 수 있는 최대 연결 개수
}

http {
    include /etc/nginx/mime.types;  # MIME 타입 설정 포함
    default_type application/octet-stream;  # 기본 파일 타입 설정

    sendfile on;  # sendfile() 시스템 콜 사용하여 파일 전송 최적화
    keepalive_timeout 65;  # 클라이언트 연결 유지 시간 (초 단위)

    access_log /var/log/nginx/access.log;  # 접근 로그 경로
    error_log /var/log/nginx/error.log;  # 오류 로그 경로

    gzip on;  # Gzip 압축 활성화
    gzip_disable "msie6";  # IE6에서 Gzip 비활성화
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml+rss text/javascript;

    # Healthcheck 엔드포인트
    server {
        listen 80;
        server_name localhost;

        location /nginx-health {
            access_log off;
            return 200 "Healthy\n";
        }
    }

    # Spring Boot (백엔드)
    server {
        listen 8080;
        server_name localhost;

        location / {
            proxy_pass http://springboot:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /nginx-health {
            access_log off;
            return 200 "Healthy\n";
        }
    }

    # Next.js Admin (프론트엔드)
    server {
        listen 3001;
        server_name localhost;

        location / {
            proxy_pass http://admin:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}