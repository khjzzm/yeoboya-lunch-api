services:
  # MySQL - 데이터 저장소
  mysql:
    image: mysql:8.0
    container_name: mysql_container
    restart: always
    env_file:
      - .env  # DB 사용자/비밀번호 환경변수 로드
    ports:
      - "3306:3306"  # 로컬에서 MySQL 접속용 포트
    volumes:
      - mysql_data:/var/lib/mysql  # 영속적 데이터 저장
      - ./mysql-init:/docker-entrypoint-initdb.d  # 초기 SQL 실행
      - ./mysql/conf.d/custom.cnf:/etc/mysql/conf.d/custom.cnf  # 커스텀 설정
    networks:
      - yeoboya_lunch_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "mysql", "-u$MYSQL_USER", "-p$MYSQL_PASSWORD" ]
      interval: 10s
      retries: 5
      timeout: 5s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "8GB"

  # Redis - 세션/토큰 캐시 저장소
  redis:
    image: redis:latest
    container_name: redis_container
    restart: always
    env_file:
      - .env
    ports:
      - "6379:6379"  # 로컬에서 Redis 접속용 포트
    volumes:
      - redis_data:/data
    command: [ "redis-server", "--bind", "0.0.0.0", "--requirepass", "$REDIS_PASSWORD" ]
    networks:
      - yeoboya_lunch_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      retries: 5
      timeout: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "2GB"

  # Spring Boot - 백엔드 API 서버
  springboot:
    build:
      context: .  # 현재 경로의 Dockerfile로 빌드
      args:
        TEST_ENABLED: "$TEST_ENABLED"
        DOCS_ENABLED: "$DOCS_ENABLED"
    image: yeoboya-lunch-api:latest
    container_name: springboot_container
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs  # 로그 저장 경로
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      retries: 5
      timeout: 5s
    networks:
      - yeoboya_lunch_network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: "4GB"

  # Nginx - 로컬 개발용 프록시 서버
  nginx:
    image: nginx:latest
    container_name: nginx_container
    restart: always
    ports:
      - "8080:8080"  # 백엔드 API 접근
      - "3001:3001"  # 어드민 프론트 접근
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  # nginx 설정 적용
    networks:
      - yeoboya_lunch_network
    depends_on:
      springboot:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/nginx-health" ]
      interval: 10s
      retries: 5
      timeout: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512MB"

networks:
  # 서비스 간 통신을 위한 공유 네트워크
  yeoboya_lunch_network:
    name: yeoboya_lunch_network
    external: true

volumes:
  # MySQL/Redis 데이터 유지
  mysql_data:
    name: yeoboya_lunch_mysql_data
    external: true

  redis_data:
    name: yeoboya_lunch_redis_data
    external: true