// ============================
// 1. 플러그인 설정
// ============================
plugins {
    id 'org.springframework.boot' version '2.7.4'
    id 'io.spring.dependency-management' version '1.0.14.RELEASE'
    id 'java'

    // 문서화
    id "org.asciidoctor.jvm.convert" version "3.3.2"
    // Git 정보 삽입
    id "com.gorylenko.gradle-git-properties" version "2.4.1"
    // Flyway 마이그레이션
    id 'org.flywaydb.flyway' version '9.8.1'
}

// ============================
// 2. 프로젝트 기본 설정
// ============================
group = 'com.yeoboya'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = JavaVersion.VERSION_11
targetCompatibility = JavaVersion.VERSION_11

// ============================
// 3. 설정 확장 (컴파일러, 문서, Flyway)
// ============================
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    asciidoctorExt
}

// ============================
// 4. 저장소 설정
// ============================
repositories {
    mavenCentral()
}

// ============================
// 5. JAR 빌드 관련 설정
// ============================
jar {
    enabled = false // bootJar 사용 시 기본 JAR 비활성화
}

// ============================
// 6. 의존성 설정
// ============================
dependencies {
    // --- Spring Boot Starters ---
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-quartz'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // --- DB 관련 ---
    implementation 'mysql:mysql-connector-java:8.0.33'
    implementation 'org.mariadb.jdbc:mariadb-java-client:2.7.2'
    runtimeOnly 'com.h2database:h2'

    // Flyway
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // --- Redis, Cache ---
    implementation 'org.springframework.boot:spring-boot-starter-data-redis:2.7.4'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // --- 보안 및 암호화 ---
    implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.4'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    implementation 'io.jsonwebtoken:jjwt-gson:0.11.5'

    // --- 로깅, 모니터링 ---
    implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // --- AWS SDK ---
    implementation platform('software.amazon.awssdk:bom:2.17.230')
    implementation 'software.amazon.awssdk:secretsmanager:2.24.12'
    implementation 'software.amazon.awssdk:s3'

    // --- 파일/이미지 처리 ---
    implementation 'net.coobird:thumbnailator:0.4.14'
    implementation 'org.imgscalr:imgscalr-lib:4.2'
    implementation 'commons-io:commons-io:2.11.0'
    implementation 'com.j256.simplemagic:simplemagic:1.17'

    // --- HTTP 클라이언트, 제한 ---
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'com.github.vladimir-bukhtoyarov:bucket4j-core:7.6.0'
    implementation 'org.json:json:20210307'

    // --- QueryDSL ---
    implementation 'com.querydsl:querydsl-core'
    implementation 'com.querydsl:querydsl-jpa'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate5'
    annotationProcessor "com.querydsl:querydsl-apt:${dependencyManagement.importedProperties['querydsl.version']}:jpa"
    annotationProcessor "jakarta.annotation:jakarta.annotation-api"
    annotationProcessor "jakarta.persistence:jakarta.persistence-api"

    // --- Lombok ---
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // --- 테스트 ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.0'
    testImplementation "org.testcontainers:testcontainers:1.17.6"
    testImplementation "org.testcontainers:junit-jupiter:1.17.6"
    testImplementation "org.testcontainers:mariadb:1.17.6"

    // --- 문서화 ---
    asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor:2.0.6.RELEASE'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc:2.0.6.RELEASE'
    implementation 'org.springdoc:springdoc-openapi-ui:1.6.14'
    implementation 'org.springdoc:springdoc-openapi-webmvc-core:1.6.14'
}

// ============================
// 7. 테스트 태스크 설정
// ============================
def testEnabled = project.hasProperty("test") && project.findProperty("test") == "true"
test {
    useJUnitPlatform()
    onlyIf { testEnabled }
}

// ============================
// 8. REST Docs 문서화 설정
// ============================
def docsEnabled = project.hasProperty("docs") && project.findProperty("docs") == "true"
asciidoctor {
    onlyIf { docsEnabled }
    configurations "asciidoctorExt"
    dependsOn test
    doFirst {
        if (docsEnabled) {
            new File("build/generated-snippets").mkdirs()
        }
    }
}

task copyDocument(type: Copy) {
    onlyIf { docsEnabled }
    dependsOn asciidoctor
    from file("${asciidoctor.outputDir}")
    into file("src/main/resources/static/docs")
}

build {
    if (docsEnabled) {
        dependsOn copyDocument
    }
}

flyway {
    url = 'jdbc:mysql://localhost:3306/mydb'
    user = 'root'
    password = 'root'
    locations = ['filesystem:src/main/resources/db/migration/mysql']
    sqlMigrationPrefix = 'V'
    sqlMigrationSeparator = '__'
    sqlMigrationSuffixes = ['.sql']
    baselineOnMigrate = true
    baselineVersion = '0'
}